<!-- Excerpt of https://store.steampowered.com/app/1086940/?l=english&cc=us, fetched 2026-10-16:
     the app name, then the right column from the awards banner to its end. -->
<html>
  <body>
    <div id="appHubAppName" class="apphub_AppName" role="heading" aria-level="1">
      Baldur's Gate 3
    </div>
    <div class="rightcol">
      <div
        id="bannerAwards"
        class="block responsive_apppage_reviewblock"
        style="width: 100%; display: none">
        <div
          data-panel='{"focusable":true,"clickOnActivate":true}'
          role="button"
          class="responsive_banner_link"
          onclick="ToggleBannerContentVisibility('#awardsTable', '#expandAwardsBtn')">
          <div class="responsive_banner_link_title">Awards</div>
          <div id="expandAwardsBtn" class="expand_section"></div>
        </div>
      </div>
      <div id="awardsTable" class="block responsive_apppage_reviewblock">
        <div class="block_title">Awards</div>
        <div class="block_content block_content_inner">
          <div id="AwardsDefault">
            <div class="game_page_autocollapse" style="max-height: 400px">
              <a
                class="steamawards2025_app_square_ctn"
                href="https://store.steampowered.com/steamawards/2025?snr=1_5_9_">
                <div class="steamawards_app_banner_event">
                  <div class="steamawards_app_banner_awardstitle">The Steam Awards&nbsp;</div>
                  <div class="steamawards2024_app_banner_year">2025</div>
                </div>
                <div class="steamawards_app_banner_contents">
                  <div class="steamawards2025_app_banner_left">
                    <span class="steamawards2025_app_banner_winner">Winner</span>
                    <div class="steamawards2025_app_banner_header award_title small">
                      Labor of Love <span>Award</span>
                    </div>
                  </div>
                  <img
                    src="https://cdn.fastly.steamstatic.com/store/promo/steamawards2025/trophy_220.png?v=3"
                    alt="" />
                </div>
              </a>
              <a
                class="steamawards2023_app_square_ctn"
                href="https://store.steampowered.com/steamawards/2023?snr=1_5_9_">
                <div class="steamawards_app_banner_event">
                  <div class="steamawards_app_banner_awardstitle">The Steam Awards&nbsp;</div>
                  <div class="steamawards2023_app_banner_year">2023</div>
                </div>
                <div class="steamawards_app_banner_contents">
                  <div class="steamawards2023_app_banner_left">
                    <span class="steamawards2023_app_banner_winner">Winner</span>
                    <div class="steamawards2023_app_banner_header award_title small">
                      Game of the Year <span>Award</span>
                    </div>
                    <div class="steamawards2023_app_banner_header award_title small">
                      Outstanding Story-Rich Game <span>Award</span>
                    </div>
                  </div>
                  <img
                    src="https://cdn.fastly.steamstatic.com/store/promo/steamawards2023/trophy_2023.png?v=3"
                    alt="" />
                </div>
              </a>
              <span class="bb_img_ctn"
                ><img
                  class="bb_img"
                  src="https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1086940/extras/fd84394f34f80fd0877908a9289d41e4.avif?t=1777363040"
                  width="794"
                  height="6008"
              /></span>
            </div>
          </div>
        </div>
      </div>

      <div id="appLinksAndInfoCtn" style="display: none">
        <div class="responsive_block_header">Links &amp; info</div>
        <div id="appLinksAndInfo" class="game_page_autocollapse" style="max-height: 180px"></div>
      </div>
    </div>
    <!-- End Right Column -->
  </body>
</html>
