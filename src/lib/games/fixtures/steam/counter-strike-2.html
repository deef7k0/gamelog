<!-- Excerpt of https://store.steampowered.com/app/730/?l=english&cc=us, fetched 2026-10-16:
     the app name, then the right column from the awards banner to its end. -->
<html>
  <body>
    <div id="appHubAppName" class="apphub_AppName" role="heading" aria-level="1">
      Counter-Strike 2
    </div>
    <div class="rightcol">
      <div
        id="bannerAwards"
        class="block responsive_apppage_reviewblock"
        style="width: 100%; display: none">
        <div
          data-panel='{"focusable":true,"clickOnActivate":true}'
          role="button"
          class="responsive_banner_link"
          onclick="ToggleBannerContentVisibility('#awardsTable', '#expandAwardsBtn')">
          <div class="responsive_banner_link_title">Awards</div>
          <div id="expandAwardsBtn" class="expand_section"></div>
        </div>
      </div>
      <div id="awardsTable" class="block responsive_apppage_reviewblock">
        <div class="block_title">Awards</div>
        <div class="block_content block_content_inner">
          <div id="AwardsDefault">
            <div class="game_page_autocollapse" style="max-height: 400px">
              <a
                class="steamawards2020_app_square_ctn"
                href="https://store.steampowered.com/steamawards/2020">
                <div class="steamawards_app_banner_event">
                  <div class="steamawards_app_banner_awardstitle">The Steam Awards&nbsp;</div>
                  <div class="steamawards2020_app_banner_year">2020</div>
                </div>
                <div class="steamawards_app_banner_contents">
                  <div class="steamawards2020_app_banner_left">
                    <span class="steamawards2020_app_banner_winner">Winner</span>
                    <div class="steamawards2020_app_banner_header award_title small">
                      Labor of Love <span>Award</span>
                    </div>
                  </div>
                  <div class="steamawards_app_banner_right">
                    <img
                      src="https://cdn.fastly.steamstatic.com/store/promo/steamawards2020/trophy2020.png?v=3"
                      alt="" />
                  </div>
                </div>
              </a>
            </div>
          </div>
        </div>
      </div>

      <div id="appLinksAndInfoCtn" style="display: none">
        <div class="responsive_block_header">Links &amp; info</div>
        <div id="appLinksAndInfo" class="game_page_autocollapse" style="max-height: 180px"></div>
      </div>
    </div>
    <!-- End Right Column -->
  </body>
</html>
