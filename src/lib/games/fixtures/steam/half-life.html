<!-- Excerpt of https://store.steampowered.com/app/70/?l=english&cc=us, fetched 2026-10-16:
     the app name, then the right column from the awards banner to its end. -->
<html>
  <body>
    <div id="appHubAppName" class="apphub_AppName" role="heading" aria-level="1">Half-Life</div>
    <div class="rightcol">
      <div
        id="appDetailsUnderlinedLinks"
        class="block responsive_apppage_details_left game_details underlined_links">
        <div class="block_content">
          <div class="block_content_inner">
            <div id="genresAndManufacturer" class="details_block">
              <b>Title:</b> Half-Life<br />

              <b>Genre:</b>
              <span data-panel='{"flow-children":"row"}'
                ><a href="https://store.steampowered.com/genre/Action/?snr=1_5_9__408"
                  >Action</a
                ></span
              ><br />

              <div class="dev_row">
                <b>Developer:</b>

                <a href="https://store.steampowered.com/developer/valve?snr=1_5_9__408">Valve</a>
              </div>

              <div class="dev_row">
                <b>Publisher:</b>

                <a href="https://store.steampowered.com/publisher/valve?snr=1_5_9__408">Valve</a>
              </div>

              <div class="dev_row">
                <b>Franchise:</b>

                <a href="https://store.steampowered.com/franchise/Half-Life?snr=1_5_9__408"
                  >Half-Life</a
                >
              </div>

              <b>Release Date:</b> Nov 19, 1998<br />
            </div>

            <div class="details_block" style="padding-top: 14px">
              <a
                class="linkbar"
                href="https://steamcommunity.com/linkfilter/?u=http%3A%2F%2Fwww.half-life.com%2F"
                target="_blank"
                rel="noreferrer  noopener">
                Visit the website
                <img
                  src="https://store.fastly.steamstatic.com/public/images/v5/ico_external_link.gif"
                  border="0"
                  align="bottom"
                  alt="External" />
              </a>

              <a
                class="linkbar responsive_chevron_right"
                href="https://store.steampowered.com/newshub/?appids=70&amp;snr=1_5_9__408"
                target="_blank"
                rel="noreferrer">
                View update history
              </a>
              <a
                class="linkbar responsive_chevron_right"
                href="https://store.steampowered.com/newshub/app/70?snr=1_5_9__408"
                target="_blank"
                rel="noreferrer">
                Read related news
              </a>

              <a
                class="linkbar responsive_chevron_right"
                href="https://steamcommunity.com/app/70/discussions/"
                target="_blank"
                rel="noreferrer">
                View discussions
              </a>

              <a
                class="linkbar responsive_chevron_right"
                href="https://steamcommunity.com/actions/Search?T=ClanAccount&K=Half-Life">
                Find Community Groups
              </a>
            </div>
          </div>
        </div>
      </div>

      <div
        id="shareEmbedRow"
        class="block responsive_apppage_details_left"
        data-panel='{"flow-children":"row"}'>
        <a
          class="btnv6_blue_hoverfade btn_medium"
          href="#"
          onclick="
            ShowEmbedWidget(70);
            return false;
          "
          ><span>Embed</span></a
        >
        <a
          id="ReportAppBtn"
          class="btnv6_blue_hoverfade btn_medium"
          href="javascript:void(0)"
          onclick="ShowReportDialog(70)"
          ><span data-tooltip-text="Report this Product" aria-label="Report this Product"
            ><i class="ico16 reportv6"></i>&nbsp;</span
          ></a
        >
      </div>

      <div id="reportBtn" style="display: none">
        <a
          class="btnv6_blue_hoverfade btn_medium"
          href="javascript:void(0)"
          onclick="ShowReportDialog(70)"
          ><span
            ><img
              src="https://store.fastly.steamstatic.com/public/shared/images/icon_report.svg"
              alt="Report this Product" /></span
        ></a>
      </div>

      <div id="apppage_metacritic_block" class="block responsive_apppage_reviewblock">
        <div id="game_area_metascore">
          <div class="score high">96</div>
          <div class="logo"></div>
          <div class="wordmark">
            <div class="metacritic">metacritic</div>
            <div id="game_area_metalink">
              <a
                href="https://www.metacritic.com/game/pc/half-life?ftag=MCD-06-10aaa1f"
                target="_blank"
                >Read Critic Reviews</a
              >
              <img
                src="https://store.fastly.steamstatic.com/public/images/ico/iconExternalLink.gif"
                border="0"
                align="bottom" />
            </div>
          </div>
        </div>
        <div style="clear: both"></div>
      </div>

      <div id="appLinksAndInfoCtn" style="display: none">
        <div class="responsive_block_header">Links &amp; info</div>
        <div id="appLinksAndInfo" class="game_page_autocollapse" style="max-height: 180px"></div>
      </div>
    </div>
    <!-- End Right Column -->
  </body>
</html>
